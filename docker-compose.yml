name: certificate-admin

services:
  mysql:
    image: mysql:8.4
    environment:
      # Local development only.
      MYSQL_ROOT_PASSWORD: root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      # 3307 on the host so it doesn't clash with a local MySQL on 3306.
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Connect over TCP: during first start-up MySQL runs a temporary
      # socket-only server, which a socket ping would report as healthy too early.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot", "--silent"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s

volumes:
  mysql_data:
