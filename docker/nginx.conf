# Serves the built web app and forwards /api to the api service.
server {
  listen 80;
  server_name _;

  # The API selects the tenant from the `tenant_id` header. nginx drops headers with
  # underscores unless this is on (spec §5.1).
  underscores_in_headers on;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Bulk issue streams NDJSON progress and CSV export streams rows: pass them through as
    # they arrive instead of buffering the whole response.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
  }

  # Hashed build assets never change, so they can be cached for long.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Client-side routes (/certificates/7, /bulk-issue, …) all load the app.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
